name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run the test suite (synthetic traffic day)
        env:
          MPLBACKEND: Agg
        run: python -m pytest test -q
      - name: Run the full pipeline on the synthetic day
        env:
          MPLBACKEND: Agg
        working-directory: src
        run: python main.py
